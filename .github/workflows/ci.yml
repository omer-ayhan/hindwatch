name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke:pack

  # Boots a simulator and runs the live smoke. Runner images change under us, so this never blocks.
  live-macos:
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Boot an iOS simulator
        run: |
          udid=$(xcrun simctl list devices available -j | node -e '
            const { devices } = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const phone = Object.values(devices).flat().find((d) => d.name.startsWith("iPhone"));
            if (phone) console.log(phone.udid);')
          test -n "$udid"
          xcrun simctl bootstatus "$udid" -b
      - run: npm run smoke:live

  # On main, once the tests pass: semantic-release reads the conventional commits since the last
  # tag, picks the version, publishes to npm, tags it and writes the GitHub release notes.
  # npm trusts this workflow through OIDC (trusted publishing), so no npm token exists anywhere,
  # and it adds provenance, which needs a public source: nothing is published while the repo is private.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --yes -p semantic-release@25.0.9 -p conventional-changelog-conventionalcommits@9.3.1 semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
